# NOVA Mobile — Unity 6 → Android APK (GitHub builds the APK)
#
# WHAT IT DOES
#   1. Builds the Unity 6 project in unity/ with game-ci/unity-builder v6
#      (Android target, IL2CPP, ARM64) and uploads the APK as an artifact.
#   2. Runs ONLY when unity/** or this workflow changes, or on manual dispatch.
#
# REQUIREMENTS (repo secrets — Zenas's step, one time)
#   - UNITY_EMAIL     : Unity ID email (henseanuesra52478@gmail.com)
#   - UNITY_PASSWORD  : Unity ID password
#   No UNITY_LICENSE needed: game-ci v6 activates the free Personal seat online
#   with email+password. (The old .ulf license-file route is dead — Unity no
#   longer issues .ulf files for Personal licenses.)
#
# STRICT RULE: nobody builds the APK locally. GitHub Actions builds it.

name: Build NOVA Mobile (Unity) APK

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - ".github/workflows/game-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-Library-Android-6000.0.23f1-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            unity-Library-Android-6000.0.23f1-

      - name: Build APK with game-ci
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          androidExportType: androidPackage
          androidVersionCode: 1
          buildName: nova-mobile-unity
          buildsPath: build/Android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-mobile-unity-apk
          path: build/Android
